<!-- macOS window frame. Placeholders: {slot} {bg} {border} {surface} {accent} {radius_card} -->
<div style="
    display:inline-block;
    font-family:{font_family};
    background:{bg};
    border:1.5px solid {border};
    border-radius:12px;
    width:340px;
    box-shadow:0 4px 16px rgba(0,0,0,0.10);
    overflow:hidden;
">
  <!-- Title bar with traffic lights -->
  <div style="
      background:{surface};
      border-bottom:1px solid {border};
      padding:8px 12px;
      display:flex;
      align-items:center;
      gap:6px;
      height:28px;
      box-sizing:border-box;
  ">
    <div style="width:10px;height:10px;border-radius:50%;background:#FF5F57;"></div>
    <div style="width:10px;height:10px;border-radius:50%;background:#FEBC2E;"></div>
    <div style="width:10px;height:10px;border-radius:50%;background:#28C840;"></div>
    <div style="flex:1;text-align:center;font-size:10px;font-weight:600;color:{text_secondary};margin-left:-36px;">
        App Window
    </div>
  </div>
  <!-- Sidebar + content split -->
  <div style="display:flex;">
    <!-- Sidebar -->
    <div style="
        width:80px;
        background:{surface};
        border-right:1px solid {border};
        padding:8px 6px;
        min-height:200px;
    ">
      {sidebar_items}
    </div>
    <!-- Main content -->
    <div style="flex:1;padding:{content_padding};background:{bg};">
      {slot}
    </div>
  </div>
</div>
